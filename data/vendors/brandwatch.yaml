      screened_entities:
      - Brandwatch
      - Brandwatch GmbH
      - Brandwatch LLC
      - Cision
      - Cision Ltd
      - Cision US Inc
      - Platinum Equity
      screening_date: '2026-10-06'
      method: 'Re-screen after false-positive review: whole-word / token boundary matching against local OFAC SDN
        + cons, UK OFSI ConList, EU FSF XML, and UN consolidated XML. Not legal advice.'
      sources:
      - https://sanctionssearch.ofac.treas.gov/
      - https://www.treasury.gov/ofac/downloads/sdn.csv
      - https://www.gov.uk/government/publications/the-uk-sanctions-list
      - https://www.sanctionsmap.eu/
      - https://scsanctions.un.org/resources/xml/en/consolidated.xml
      confidence: High
      result: clear — prior 'REVIEW REQUIRED' was a false positive (unrelated list entries)
      false_positive_analysis:
        prior_flag_reason: Naive substring match on parent name 'Cision' matched inside unrelated tokens such as
          English/French 'PRECISION' / 'PRÉCISION' on OFAC/EU lists (e.g. China National PreCISION Machinery; A.E.
          Nudelman precision bureau FR alias).
        actual_list_entries_examined:
        - list: OFAC SDN
          entry: CHINA NATIONAL PRECISION MACHINERY IMPORT/EXPORT CORPORATION (and similar 'PRECISION' entities)
          related_to_vendor: false
        - list: EU FSF
          entry: French aliases containing 'précision' (machinery institutes)
          related_to_vendor: false
        verdict: false_positive
        reasoning: Brandwatch and Cision (PR/media software group owned by Platinum Equity affiliate since Jan 2020;
          Brandwatch acquired by Cision Jun 2021) do not appear as designated parties. Substring 'Cision' inside
          'Precision' is not a designation of Cision Ltd/Brandwatch.
      owners_parents_screened:
      - name: Cision / Cision Ltd
        result: clear (false positive on PRECISION)
        source: https://www.prnewswire.co.uk/news-releases/cision-closes-brandwatch-acquisition-883471423.html
      - name: Platinum Equity (Cision owner)
        result: clear — no whole-word hit
        source: https://www.platinumequity.com/news/platinum-equity-completes-2-7-billion-acquisition-of-cision/
