# yaml-language-server: $schema=../schema/vendor.schema.json
# Copy this file to data/vendors/<slug>.yaml and remove the leading underscore
# from the new name. Do not remove the underscore on this copy: files that
# start with "_" are templates and are not published.
#
# Full field notes: docs/vendor-schema.md
# Filled fictional examples: example-vendor-a.yaml and example-vendor-b.yaml
#
# Real vendors stay owner_approved: false until Nico Dekens approves them.
# Jurisdiction & sanctions is company-level only. No named employees.
# Known customers are public organizations only. No private individuals.

schema_version: 1
slug: replace-me
name: Replace with the vendor name
example: false
owner_approved: false
status: draft
last_reviewed: "2026-10-06"
reviewed_by: Your name
tagline: One sentence a buyer can scan.
summary: Two or three sentences. Say what is known and what is still missing.

website:
  text: https://example.com/replace-me
  source: https://example.com/replace-me
  source_label: Company site
  accessed: "2026-10-06"
  confidence: unverified

headquarters:
  city: City
  country: Country
  country_code: NL
  source: https://example.com/replace-me/about
  source_label: About page
  accessed: "2026-10-06"
  confidence: unverified

founded_year: 2000
categories:
  - people-search
primary_category: people-search
use_cases:
  - investigations-due-diligence

company:
  legal_name: { text: Legal entity, source: https://example.com/replace-me, source_label: Registry, accessed: "2026-10-06", confidence: unverified }
  ownership: { text: Who controls the company, at entity level., source: https://example.com/replace-me, source_label: Ownership note, accessed: "2026-10-06", confidence: unverified }
  founded: { text: "2000", source: https://example.com/replace-me, source_label: About page, accessed: "2026-10-06", confidence: unverified }
  employees: { text: Headcount or band, aggregate only., source: https://example.com/replace-me, source_label: Careers page, accessed: "2026-10-06", confidence: unverified }
  customers: { text: Narrative summary. Point at known_customers. Say if the list is incomplete., source: https://example.com/replace-me, source_label: Customers page, accessed: "2026-10-06", confidence: unverified }
  pricing_model: { text: How the product is sold., source: https://example.com/replace-me, source_label: Pricing page, accessed: "2026-10-06", confidence: unverified }
  products:
    - name: Product name
      summary: { text: What the product is., source: https://example.com/replace-me, source_label: Product page, accessed: "2026-10-06", confidence: unverified }

five_w:
  who: { text: Who operates it and who it is sold to., source: https://example.com/replace-me, source_label: About page, accessed: "2026-10-06", confidence: unverified }
  what: { text: What the product claims to do., source: https://example.com/replace-me, source_label: Product page, accessed: "2026-10-06", confidence: unverified }
  where: { text: Headquarters, hosting, and markets., source: https://example.com/replace-me, source_label: Privacy notice, accessed: "2026-10-06", confidence: unverified }
  when: { text: Founded, major events, and this review., source: https://example.com/replace-me, source_label: About page, accessed: "2026-10-06", confidence: unverified }
  why: { text: The stated reason a buyer would use it., source: https://example.com/replace-me, source_label: About page, accessed: "2026-10-06", confidence: unverified }
  how: { text: How it is delivered (app, API, contract). Not a collection guide., source: https://example.com/replace-me, source_label: Docs, accessed: "2026-10-06", confidence: unverified }

strengths:
  - { text: One sourced strength., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
weaknesses:
  - { text: One sourced weakness or gap., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }

scores:
  business_transparency:
    score: 0
    summary: { text: Why this score., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
    evidence:
      - { text: A fact behind the score., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
  financial_health:
    score: 0
    summary: { text: Why this score. Not a credit rating., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
    evidence:
      - { text: A fact behind the score., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
  customer_opsec:
    score: 0
    summary: { text: Residual risk to the customer. Higher is safer for the customer., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
    evidence:
      - { text: A fact behind the score., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }

financial:
  funding: { text: Rounds or "no public round"., source: https://example.com/replace-me, source_label: Funding note, accessed: "2026-10-06", confidence: unverified }
  investors: []
  revenue_signals: { text: What is public, including the absence of a figure., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
  stability: { text: Longevity and distress signals., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }

press:
  positive: []
  negative: []

social_sentiment:
  tone: unknown
  summary: { text: What public comments show. Not a live scrape., source: https://example.com/replace-me, source_label: Source, accessed: "2026-10-06", confidence: unverified }
  signals: []

opsec:
  summary: { text: The residual risk in one paragraph., source: https://example.com/replace-me, source_label: Privacy notice, accessed: "2026-10-06", confidence: unverified }
  data_retention: { text: How long customer data is kept., risk: unknown, source: https://example.com/replace-me, source_label: Privacy notice, accessed: "2026-10-06", confidence: unverified }
  query_logging: { text: Whether query text or only metadata is logged., risk: unknown, source: https://example.com/replace-me, source_label: Logging policy, accessed: "2026-10-06", confidence: unverified }
  jurisdiction: { text: Controller and hosting country. Not legal advice., risk: unknown, source: https://example.com/replace-me, source_label: Privacy notice, accessed: "2026-10-06", confidence: unverified }
  ownership_state_links: { text: State ownership, if any., risk: unknown, source: https://example.com/replace-me, source_label: Ownership note, accessed: "2026-10-06", confidence: unverified }
  third_party_sharing: { text: Subprocessors and onward sharing., risk: unknown, source: https://example.com/replace-me, source_label: Subprocessors, accessed: "2026-10-06", confidence: unverified }

data_residency:
  summary: { text: Where data is hosted., source: https://example.com/replace-me, source_label: Residency page, accessed: "2026-10-06", confidence: unverified }
  regions: []
  gdpr: { text: Controller or processor role., source: https://example.com/replace-me, source_label: Privacy notice, accessed: "2026-10-06", confidence: unverified }
  dpa: { text: Whether a DPA is public., source: https://example.com/replace-me, source_label: DPA page, accessed: "2026-10-06", confidence: unverified }

certifications: []
integrations:
  summary: { text: Integrations in one line., source: https://example.com/replace-me, source_label: Integrations, accessed: "2026-10-06", confidence: unverified }
  api: { text: Whether an API exists and how it is documented., source: https://example.com/replace-me, source_label: API docs, accessed: "2026-10-06", confidence: unverified }
  items: []
legal: []

# Company-level only. countries lists review-list presences (Russia, Belarus,
# China, or another sanctioned country). Empty means none found.
jurisdiction_sanctions:
  risk: unknown
  summary: { text: Rollup of entities, ties, workforce signals, and screening., source: https://example.com/replace-me, source_label: Sanctions note, accessed: "2026-10-06", confidence: unverified }
  offices_and_entities:
    text: Offices, R&D sites, and legal entities in review-list countries.
    countries: []
    risk: unknown
    source: https://example.com/replace-me
    source_label: Entity list
    accessed: "2026-10-06"
    confidence: unverified
  ownership_ties:
    text: Owner, investor, and leadership entities. Do not name private individuals.
    risk: unknown
    source: https://example.com/replace-me
    source_label: Ownership note
    accessed: "2026-10-06"
    confidence: unverified
  workforce_signals:
    text: Aggregate headcount by employing entity or region. No individuals.
    risk: unknown
    source: https://example.com/replace-me
    source_label: Careers page
    accessed: "2026-10-06"
    confidence: unverified
  screening:
    - { regime: EU, result: not-screened, screened_on: "2026-10-06", text: Names checked and the result., source: https://example.com/replace-me, source_label: EU screening note, accessed: "2026-10-06", confidence: unverified }
    - { regime: UN, result: not-screened, screened_on: "2026-10-06", text: Names checked and the result., source: https://example.com/replace-me, source_label: UN screening note, accessed: "2026-10-06", confidence: unverified }
    - { regime: OFAC, result: not-screened, screened_on: "2026-10-06", text: Names checked and the result., source: https://example.com/replace-me, source_label: OFAC screening note, accessed: "2026-10-06", confidence: unverified }
    - { regime: UK, result: not-screened, screened_on: "2026-10-06", text: Names checked and the result., source: https://example.com/replace-me, source_label: UK screening note, accessed: "2026-10-06", confidence: unverified }

# Public organizations only. evidence_type is case-study, government-contract,
# press-release, or press-report. sector is a taxonomy id.
known_customers: []

use_case_fit: []
